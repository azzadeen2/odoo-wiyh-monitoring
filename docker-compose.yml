services:
  db15:
    image: ${POSTGRES_IMAGE:-postgres:15}
    user: root
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    restart: always # run as a service
    volumes:
      - odoo-db-data:/var/lib/postgresql/data
    # ports:
    #   - "5433:5433"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4
    environment:
      - PGADMIN_DEFAULT_EMAIL=${PGADMIN_EMAIL:-admin@admin.com}
      - PGADMIN_DEFAULT_PASSWORD=${PGADMIN_PASSWORD:-admin}
    ports:
      - "${PGADMIN_PORT:-5050}:80"
    depends_on:
      - db15
    restart: always

  odoo17-ssys:
    # build:
    #   context: ./odoo
    #   dockerfile: Dockerfile
    image: ${ODOO_IMAGE:-odoo:17}
    # user: root
    # depends_on:
      # pgbouncer:
        # condition: service_healthy
      # redis:
      #   condition: service_healthy
    # Ports exposed via nginx load balancer
    expose:
      - "8069"
      - "8072"
    tty: true
    deploy:
      replicas: 3
    # command: odoo -i base --db_host=db --database ${POSTGRES_DB} --db_user ${POSTGRES_USER} --db_password ${POSTGRES_PASSWORD}
    # environment:
     # - HOST=pgbouncer
     # - USER=${POSTGRES_USER}
     # - PASSWORD=${POSTGRES_PASSWORD}
    # - PORT=${DB_PORT}
      # Redis Session Configuration
      # - ODOO_SESSION_REDIS=${ODOO_SESSION_REDIS}
      # - ODOO_SESSION_REDIS_HOST=${ODOO_SESSION_REDIS_HOST}
      # - ODOO_SESSION_REDIS_PORT=${ODOO_SESSION_REDIS_PORT}
      # - ODOO_SESSION_REDIS_PREFIX=${ODOO_SESSION_REDIS_PREFIX}
      # - ODOO_SESSION_REDIS_EXPIRATION=${ODOO_SESSION_REDIS_EXPIRATION}
      # - ODOO_SESSION_REDIS_EXPIRATION_ANONYMOUS=${ODOO_SESSION_REDIS_EXPIRATION_ANONYMOUS}
    volumes:
      #- /etc/timezone:/etc/timezone:ro
      #- /etc/localtime:/etc/localtime:ro
      # - ./entrypoint.sh:/entrypoint.sh   # if you want to install additional Python packages, uncomment this line!
      - ./extra-addons/:/mnt/extra-addons
      - ./addon_tools:/mnt/addon_tools
      - ./addons2:/mnt/extra-addons2
      # - ./construction_addons:/mnt/construction_addons
      - ./config:/etc/odoo
      - odoo-web-session:/var/lib/odoo/sessions
      - odoo-web-filestore:/var/lib/odoo/filestore
    restart: always # run as a service
    # ports:
      # - "8069:8069" 
      # - "8072:8072" 

  pgbouncer:
    image: edoburu/pgbouncer
    shm_size: "2g"
    deploy:
      resources:
        reservations:
          memory: 128M  
        limits:
          memory: 256M
    environment:
      DB_HOST: db15
      DATABASES: "*=host=db15 port=5432 user=${ODOO_USER} password=${ODOO_PASSWORD}"
      AUTH_FILE: "/etc/pgbouncer/userlist.txt"
      AUTH_TYPE: "plain"
      POOL_MODE: "session"
      MAX_CLIENT_CONN: "100"
      DEFAULT_POOL_SIZE: "30"
      LISTEN_PORT: "6432"
    volumes:
      - ./pgbouncer/userlist.txt:/etc/pgbouncer/userlist.txt
    # ports:
    #   - "6432:6432"
    depends_on:
      db15:
        condition: service_healthy
    # healthcheck:
    #   test: [ "CMD", "pg_isready", "-U", "${POSTGRES_USER}", "-d", "${POSTGRES_DB}", "-h", "localhost", "-p", "6432" ]
    #   interval: 5s
    #   timeout: 5s
    #   retries: 5

  nginx:
    image: nginx:alpine
    depends_on:
      - odoo17-ssys
    ports:
      - "${NGINX_PORT}:80"      # Odoo HTTP (mapped from internal 80)
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - nginx-logs:/var/log/nginx
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost/nginx-health"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: always

  # ===========================================
  # Monitoring Stack
  # ===========================================

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=30d"
      - "--storage.tsdb.retention.size=10GB"
      - "--web.enable-lifecycle"
    depends_on:
      - postgres-exporter
      - pgbouncer-exporter
      # - redis-exporter
      - nginx-exporter
    restart: always

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin@2026}
      - GF_USERS_ALLOW_SIGN_UP=false
    depends_on:
      - prometheus
      - loki
    restart: always

  loki:
    image: grafana/loki:3.7.0
    container_name: loki
    ports:
      - "${LOKI_PORT:-3100}:3100"
    volumes:
      - ./monitoring/loki-config.yaml:/etc/loki/local-config.yaml:ro
      - loki-data:/loki
    command: -config.file=/etc/loki/local-config.yaml
    restart: always

  alloy:
    image: grafana/alloy:latest
    container_name: alloy
    volumes:
      - ./monitoring/alloy-config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /var/log:/var/log:ro
    command: run --server.http.listen-addr=0.0.0.0:12345 /etc/alloy/config.alloy
    depends_on:
      - loki
    restart: always

  # ===========================================
  # Exporters
  # ===========================================

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:latest
    container_name: postgres-exporter
    environment:
      DATA_SOURCE_URI: "db15:5432/${ODOO_DB_NAME:-postgres}?sslmode=disable"
      DATA_SOURCE_USER: "${POSTGRES_USER}"
      DATA_SOURCE_PASS: "${POSTGRES_PASSWORD}"
    depends_on:
      db15:
        condition: service_healthy
    restart: always

  pgbouncer-exporter:
    image: prometheuscommunity/pgbouncer-exporter:latest
    container_name: pgbouncer-exporter
    environment:
      PGBOUNCER_HOST: "pgbouncer"
      PGBOUNCER_PORT: "6432"
      PGBOUNCER_USER: "${ODOO_USER}"
      PGBOUNCER_PASSWORD: "${ODOO_PASSWORD}"
    depends_on:
      - pgbouncer
    restart: always

  # redis-exporter:
  #   image: oliver006/redis_exporter:latest
  #   container_name: redis-exporter
  #   environment:
  #     REDIS_ADDR: "redis:6379"
  #   restart: always

  nginx-exporter:
    image: nginx/nginx-prometheus-exporter:latest
    container_name: nginx-exporter
    command:
      - "--nginx.scrape-uri=http://nginx:80/stub_status"
    depends_on:
      - nginx
    restart: always

volumes:
  odoo-web-session:
  odoo-web-filestore:
  odoo-db-data:
  nginx-logs:
  prometheus-data:
  grafana-data:
  loki-data:
